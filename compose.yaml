services:
  backup:
    image: ${MM_IMAGE:?Set MM_IMAGE to the amd64 or arm64 image tag}
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${MM_STORAGE_DIR:-./mm-storage}:/app/mm-storage
      - ${MM_CONFIG_FILE:-./mm-config.yaml}:/app/mm-config.yaml:ro
    stop_grace_period: 10m
