services:
  backup:
    image: ${MM_IMAGE:?Set MM_IMAGE to the amd64 or arm64 image tag}
    restart: unless-stopped
    user: "${MM_UID:-1000}:${MM_GID:-1000}"
    entrypoint: ["/usr/local/bin/mysql-timevault", "--config", "/app/mm-config.yaml", "--storage-dir", "/app/mm-storage"]
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${MM_STORAGE_DIR:-./mm-storage}:/app/mm-storage
      - ${MM_CONFIG_FILE:-./mm-config.yaml}:/app/mm-config.yaml:ro
    stop_grace_period: 10m
