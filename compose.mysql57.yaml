# Compose overrides for a MySQL 5.7 source. The official image is amd64-only.
services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    command:
      - --log-error=/var/lib/mysql/error.log
      - --slow-query-log=ON
      - --log-output=TABLE
      - --long-query-time=${MYSQL_SLOW_QUERY_SECONDS:-2}
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog-format=ROW
      - --max-binlog-size=67108864
      - --expire-logs-days=7
