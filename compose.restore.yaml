# Only load this overlay when restoring into a separate, empty MySQL instance.
services:
  mysql_restore:
    image: ${MYSQL_RESTORE_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_RESTORE_ROOT_PASSWORD:?Set MYSQL_RESTORE_ROOT_PASSWORD in .env}
    volumes:
      - ./storage/mysql-restore:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mysql_private

  backup:
    environment:
      MYSQL_RESTORE_ROOT_PASSWORD: ${MYSQL_RESTORE_ROOT_PASSWORD:?Set MYSQL_RESTORE_ROOT_PASSWORD in .env}
